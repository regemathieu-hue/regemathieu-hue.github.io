<!DOCTYPE html>

  <title>{app} – {support_title}</title>
  <link rel="stylesheet" href="{root}assets/style.css">
{alternates}{redirect}</head>
<body>

  <h2>{faq_h}</h2>

  <div class="card">
    <p>{privacy_summary}<br><br>

  <h2 id="languages">{language_list_h}</h2>

{languages}

  <footer>© {year} {author} · <a href="{home}">{all_apps}</a></footer>
